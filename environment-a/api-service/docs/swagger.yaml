basePath: /api/v1
definitions:
  dto.ActivityLogDTO:
    properties:
      action:
        type: string
      created_at:
        type: string
      id:
        type: string
      resource_id:
        type: string
      resource_type:
        type: string
      user_id:
        type: string
    type: object
  dto.ActivityLogListResponse:
    properties:
      activity_logs:
        items:
          $ref: '#/definitions/dto.ActivityLogDTO'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      status:
        type: string
      total:
        type: integer
    type: object
  dto.AdminActivityPointDTO:
    properties:
      date:
        type: string
      deletes:
        type: integer
      downloads:
        type: integer
      logins:
        type: integer
      restores:
        type: integer
      stars:
        type: integer
      uploads:
        type: integer
    type: object
  dto.AdminAnalyticsResponse:
    properties:
      activity:
        items:
          $ref: '#/definitions/dto.AdminActivityPointDTO'
        type: array
      depths:
        items:
          $ref: '#/definitions/dto.AdminDepthStatDTO'
        type: array
      file_types:
        items:
          $ref: '#/definitions/dto.AdminFileTypeStatDTO'
        type: array
      generated_at:
        type: string
      range:
        type: string
      size_buckets:
        items:
          $ref: '#/definitions/dto.AdminSizeBucketStatDTO'
        type: array
      status:
        type: string
      summary:
        $ref: '#/definitions/dto.AdminAnalyticsSummaryDTO'
    type: object
  dto.AdminAnalyticsSummaryDTO:
    properties:
      active_files:
        type: integer
      active_folders:
        type: integer
      active_storage_bytes:
        type: integer
      active_users:
        type: integer
      dedup_ratio:
        type: number
      deleted_items_in_range:
        type: integer
      downloads_in_range:
        type: integer
      new_chunks:
        type: integer
      restored_items_in_range:
        type: integer
      reuse_chunks:
        type: integer
      starred_actions_in_range:
        type: integer
      starred_files:
        type: integer
      starred_folders:
        type: integer
      total_admins:
        type: integer
      total_chunks:
        type: integer
      total_users:
        type: integer
      trash_files:
        type: integer
      trash_folders:
        type: integer
      trash_storage_bytes:
        type: integer
      uploads_in_range:
        type: integer
    type: object
  dto.AdminDepthStatDTO:
    properties:
      count:
        type: integer
      depth:
        type: integer
    type: object
  dto.AdminFileTypeStatDTO:
    properties:
      count:
        type: integer
      total_bytes:
        type: integer
      type:
        type: string
    type: object
  dto.AdminSizeBucketStatDTO:
    properties:
      bucket:
        type: string
      count:
        type: integer
    type: object
  dto.BreadcrumbResponse:
    properties:
      breadcrumb:
        items:
          $ref: '#/definitions/dto.DirectoryDTO'
        type: array
      directory_id:
        type: string
      status:
        type: string
    type: object
  dto.CreateDirectoryRequest:
    properties:
      name:
        maxLength: 255
        type: string
      parent_id:
        type: string
    required:
    - name
    type: object
  dto.DirectoryDTO:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      depth:
        type: integer
      id:
        type: string
      name:
        type: string
      parent_id:
        type: string
      starred_at:
        type: string
    type: object
  dto.DirectoryMutationResponse:
    properties:
      directory:
        $ref: '#/definitions/dto.DirectoryDTO'
      status:
        type: string
    type: object
  dto.DirectoryResponse:
    properties:
      directory:
        $ref: '#/definitions/dto.DirectoryDTO'
      status:
        type: string
    type: object
  dto.DirectoryTreeResponse:
    properties:
      directories:
        items:
          $ref: '#/definitions/dto.DirectoryDTO'
        type: array
      root_id:
        type: string
      status:
        type: string
    type: object
  dto.ErrorResponse:
    properties:
      error:
        example: unauthorized
        type: string
      status:
        example: error
        type: string
    type: object
  dto.FileDTO:
    properties:
      chunk_count:
        type: integer
      created_at:
        type: string
      dedup_ratio:
        type: number
      deleted_at:
        type: string
      directory_id:
        type: string
      id:
        type: string
      manifest_id:
        type: string
      mime_type:
        type: string
      name:
        type: string
      new_chunk_count:
        type: integer
      reuse_chunk_count:
        type: integer
      size_bytes:
        type: integer
      starred_at:
        type: string
      status_penyimpanan:
        type: string
    type: object
  dto.FileDetailResponse:
    properties:
      file:
        $ref: '#/definitions/dto.FileDTO'
      status:
        type: string
    type: object
  dto.FileListResponse:
    properties:
      directory_id:
        type: string
      files:
        items:
          $ref: '#/definitions/dto.FileDTO'
        type: array
      status:
        type: string
    type: object
  dto.FileManifestResponse:
    properties:
      file:
        $ref: '#/definitions/dto.FileDTO'
      manifest:
        $ref: '#/definitions/dto.ManifestInfoDTO'
      status:
        type: string
    type: object
  dto.FileMutationResponse:
    properties:
      file:
        $ref: '#/definitions/dto.FileDTO'
      status:
        type: string
    type: object
  dto.FileSearchResponse:
    properties:
      directory_id:
        type: string
      files:
        items:
          $ref: '#/definitions/dto.FileDTO'
        type: array
      include_deleted:
        type: boolean
      limit:
        type: integer
      offset:
        type: integer
      query:
        type: string
      status:
        type: string
      total:
        type: integer
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      status:
        type: string
      user:
        $ref: '#/definitions/dto.UserDTO'
    type: object
  dto.ManifestInfoDTO:
    properties:
      chunk_count:
        type: integer
      created_at:
        type: string
      file_hash:
        type: string
      immutable:
        type: boolean
      manifest_id:
        type: string
      total_size_bytes:
        type: integer
    type: object
  dto.MeResponse:
    properties:
      status:
        type: string
      user:
        $ref: '#/definitions/dto.UserDTO'
    type: object
  dto.OKResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      confirm_password:
        type: string
      email:
        type: string
      full_name:
        maxLength: 150
        minLength: 2
        type: string
      password:
        minLength: 8
        type: string
    required:
    - confirm_password
    - email
    - full_name
    - password
    type: object
  dto.SoftDeleteResponse:
    properties:
      deleted_at:
        type: string
      file_id:
        type: string
      status:
        type: string
    type: object
  dto.StarredResponse:
    properties:
      directories:
        items:
          $ref: '#/definitions/dto.DirectoryDTO'
        type: array
      files:
        items:
          $ref: '#/definitions/dto.FileDTO'
        type: array
      status:
        type: string
    type: object
  dto.TrashResponse:
    properties:
      directories:
        items:
          $ref: '#/definitions/dto.DirectoryDTO'
        type: array
      files:
        items:
          $ref: '#/definitions/dto.FileDTO'
        type: array
      status:
        type: string
    type: object
  dto.UpdateProfileRequest:
    properties:
      current_password:
        type: string
      email:
        type: string
      full_name:
        maxLength: 150
        minLength: 2
        type: string
      new_password:
        minLength: 8
        type: string
    required:
    - email
    - full_name
    type: object
  dto.UploadCommitResultDTO:
    properties:
      chunk_count:
        type: integer
      dedup_ratio:
        type: number
      file_hash:
        type: string
      immutable:
        type: boolean
      manifest_id:
        type: string
      new_chunk_count:
        type: integer
      reuse_chunk_count:
        type: integer
      total_size_bytes:
        type: integer
    type: object
  dto.UploadResponse:
    properties:
      file:
        $ref: '#/definitions/dto.FileDTO'
      status:
        type: string
      upload_commit_result:
        $ref: '#/definitions/dto.UploadCommitResultDTO'
    type: object
  dto.UserDTO:
    properties:
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      role:
        type: string
    type: object
info:
  contact: {}
  description: API service untuk autentikasi, hierarki direktori, dan metadata berkas
    immutable.
  title: HashBox API Service
  version: "1.0"
paths:
  /activity-logs:
    get:
      description: Menampilkan riwayat aktivitas pengguna saat ini dengan filter dan
        pagination opsional
      parameters:
      - description: Filter berdasarkan aksi
        in: query
        name: action
        type: string
      - description: Filter berdasarkan tipe resource
        in: query
        name: resource_type
        type: string
      - description: Ukuran halaman (1-200, default 20)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ActivityLogListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Riwayat aktivitas
      tags:
      - aktivitas
  /admin/analytics:
    get:
      description: Menampilkan analitik aplikasi agregat dan aman privasi untuk admin
      parameters:
      - description: 'Rentang analitik: 7d, 30d, atau 90d'
        in: query
        name: range
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AdminAnalyticsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Analitik admin
      tags:
      - admin
  /auth/login:
    post:
      consumes:
      - application/json
      description: Membuat bearer access token untuk sesi aktif dari email dan password
      parameters:
      - description: Payload masuk
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Masuk
      tags:
      - autentikasi
  /auth/logout:
    post:
      description: Mencabut sesi akses saat ini
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.OKResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Keluar
      tags:
      - autentikasi
  /auth/me:
    get:
      description: Menampilkan profil pengguna terautentikasi
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Pengguna saat ini
      tags:
      - autentikasi
    patch:
      consumes:
      - application/json
      description: Memperbarui profil pengguna terautentikasi dan opsional mengganti
        password
      parameters:
      - description: Profil payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update profil
      tags:
      - autentikasi
  /auth/register:
    post:
      consumes:
      - application/json
      description: Membuat akun pengguna baru dengan peran user
      parameters:
      - description: Payload pendaftaran
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.MeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Daftar pengguna
      tags:
      - autentikasi
  /directories:
    post:
      consumes:
      - application/json
      description: Membuat direktori root atau direktori bertingkat di ruang pengguna
      parameters:
      - description: Payload pembuatan direktori
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.CreateDirectoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.DirectoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Buat direktori
      tags:
      - direktori
  /directories/{id}:
    delete:
      description: Melakukan soft delete pada subtree direktori dan memindahkannya
        ke Sampah
      parameters:
      - description: UUID direktori
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DirectoryMutationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Pindahkan direktori ke Sampah
      tags:
      - direktori
  /directories/{id}/breadcrumb:
    get:
      description: Menyusun path breadcrumb untuk direktori tertentu
      parameters:
      - description: UUID direktori
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BreadcrumbResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Breadcrumb direktori
      tags:
      - direktori
  /directories/{id}/files:
    get:
      description: Menampilkan berkas pada direktori dengan opsi include_deleted=true
      parameters:
      - description: UUID direktori
        in: path
        name: id
        required: true
        type: string
      - description: Sertakan berkas yang sudah soft delete
        in: query
        name: include_deleted
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FileListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Berkas direktori
      tags:
      - direktori
  /directories/{id}/permanent:
    delete:
      description: Menghapus permanen metadata subtree direktori dari Sampah
      parameters:
      - description: UUID direktori
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.OKResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Hapus permanen metadata direktori
      tags:
      - direktori
  /directories/{id}/restore:
    post:
      description: Memulihkan subtree direktori yang sebelumnya dihapus secara logis
      parameters:
      - description: UUID direktori
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DirectoryMutationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Pulihkan direktori dari Sampah
      tags:
      - direktori
  /directories/{id}/star:
    delete:
      description: Menghapus penanda bintang dari direktori
      parameters:
      - description: UUID direktori
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DirectoryMutationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Hapus bintang direktori
      tags:
      - direktori
    put:
      description: Menandai direktori sebagai berbintang
      parameters:
      - description: UUID direktori
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DirectoryMutationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Tandai bintang direktori
      tags:
      - direktori
  /directories/tree:
    get:
      description: Menampilkan direktori root atau subtree berdasarkan root_id
      parameters:
      - description: UUID direktori root
        in: query
        name: root_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DirectoryTreeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Pohon direktori
      tags:
      - direktori
  /files:
    get:
      description: Menampilkan berkas pada Berkas Saya atau di dalam direktori saat
        directory_id diisi
      parameters:
      - description: UUID direktori; kosongkan untuk Berkas Saya
        in: query
