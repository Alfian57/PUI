name: CI/CD

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - "**"
        tags:
            - "v*"
    workflow_dispatch:

concurrency:
    group: ci-cd-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ci-go:
        name: CI Go Modules
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.25.x"
                  cache: true
                  cache-dependency-path: |
                      go.work.sum
                      environment-a/api-service/go.sum
                      environment-b/vault-core/go.sum

            - name: Verify Go formatting
              run: |
                  set -euo pipefail
                  modules=(
                    "environment-a/api-service"
                    "environment-b/vault-core"
                    "shared/uds"
                  )

                  for module in "${modules[@]}"; do
                    echo "Checking gofmt in ${module}"
                    unformatted=$(cd "${module}" && gofmt -l .)
                    if [[ -n "${unformatted}" ]]; then
                      echo "Unformatted files found in ${module}:"
                      echo "${unformatted}"
                      exit 1
                    fi
                  done

            - name: Run go vet and tests
              run: |
                  set -euo pipefail
                  modules=(
                    "environment-a/api-service"
                    "environment-b/vault-core"
                    "shared/uds"
                  )

                  for module in "${modules[@]}"; do
                    echo "Running checks in ${module}"
                    (
                      cd "${module}"
                      go vet ./...
                      go test ./...
                    )
                  done

    ci-web:
        name: CI Web Client
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: environment-a/web-client

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: environment-a/web-client/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build web client
              run: npm run build

    ci-compose:
        name: CI Docker Compose Config
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Validate docker compose
              run: docker compose --env-file .env.example -f docker-compose.yml config -q

    cd-images:
        name: CD Build and Push Images
        runs-on: ubuntu-latest
        needs:
            - ci-go
            - ci-web
            - ci-compose
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' ||
            startsWith(github.ref, 'refs/tags/v'))
        permissions:
            contents: read
            packages: write

        strategy:
            fail-fast: false
            matrix:
                include:
                    - image: api-service
                      context: environment-a/api-service
                      dockerfile: environment-a/api-service/Dockerfile
                    - image: vault-core
                      context: environment-b/vault-core
                      dockerfile: environment-b/vault-core/Dockerfile
                    - image: web-client
                      context: environment-a/web-client
                      dockerfile: environment-a/web-client/Dockerfile.prod

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Normalize owner name
              id: owner
              run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.DOCKER_TOKEN }}

            - name: Extract image metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ steps.owner.outputs.value }}/pui-${{ matrix.image }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=tag
                      type=sha,prefix=sha-
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: ${{ matrix.context }}
                  file: ${{ matrix.dockerfile }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://pui-api.alfian-gading.my.id' }}
                      VITE_SECURITY_LAB_ENABLED=${{ vars.VITE_SECURITY_LAB_ENABLED || 'false' }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    cd-deploy:
        name: CD Deploy to VPS
        runs-on: ubuntu-latest
        needs:
            - cd-images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        steps:
            - name: Configure SSH
              env:
                  VPS_HOST: ${{ secrets.VPS_HOST }}
                  VPS_KEY: ${{ secrets.VPS_KEY }}
                  VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
              run: |
                  set -euo pipefail
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "${VPS_KEY}" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  ssh-keyscan -p "${VPS_SSH_PORT}" "${VPS_HOST}" >> ~/.ssh/known_hosts

            - name: Deploy PUI stack
              env:
                  VPS_HOST: ${{ secrets.VPS_HOST }}
                  VPS_USER: ${{ secrets.VPS_USER }}
                  VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
              run: |
                  set -euo pipefail
                  ssh -i ~/.ssh/deploy_key -p "${VPS_SSH_PORT}" "${VPS_USER}@${VPS_HOST}" '
                    set -euo pipefail
                    app_dir=/opt/docker-stack/applications/pui
                    if [ ! -x "${app_dir}/update.sh" ]; then
                      echo "PUI has not been provisioned by Ansible yet; skipping deploy."
                      exit 0
                    fi
                    cd "${app_dir}"
                    DOCKER_REGISTRY_USER=alfian57 ./update.sh
                  '
